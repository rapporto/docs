<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="index.css" type="text/css">
    <link rel="stylesheet" href="//cdnjs.cloudflare.com/ajax/libs/highlight.js/11.7.0/styles/default.min.css">
    <script src="//cdnjs.cloudflare.com/ajax/libs/highlight.js/11.7.0/highlight.min.js"></script>
    <title>REST Project</title>
</head>

<body>
    <div class="container">
        <div class="form" id="form">
            <div>
                <div id="messages-title" class="div-title div-title-active">Сообщения</div>
                <div id="options-title" class="div-title">Настройки запроса</div>
                <div id="options-content" class="hidden"></div>
                <div id="messages-content"></div>
            </div>
        </div>
        <div class="data">
            <div class="data-title">
                <button id="copy"><img src="img/copy.svg" class="btn-icon">Копировать</button>
                <span id="copy_result" class="copy_result hidden">Скопировано!</span>
            </div>
            <pre><code id="code" class="json"></code></pre>
        </div>
    </div>
    <script type="module" src="index.js"></script>
</body>

</html>
