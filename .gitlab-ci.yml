stages:
  - build
  - deploy
  - publish

variables:
  BUILD_DIR: "build"
  TARGET_DIR: "/docs/_build/"

build:
  stage: build
  image: python:3.9
  script:
    - pip install --use-deprecated=legacy-resolver -r requirements.txt
    - rm -rf $BUILD_DIR
    - sphinx-build -b html source $BUILD_DIR/html
  artifacts:
    paths:
      - $BUILD_DIR/html

deploy_test:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client
    - mkdir -p ~/.ssh
    - echo "$TEST_SSH_KEY" > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - ssh-keyscan -H $TEST_SERVER >> ~/.ssh/known_hosts
  script:
    - apk add --no-cache rsync
    - rsync -avz --delete $BUILD_DIR/html/ $USER@$TEST_SERVER:$TARGET_DIR
  only:
    - test

deploy_prod:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client
    - mkdir -p ~/.ssh
    - echo "$PROD_SSH_KEY" > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - ssh-keyscan -H $PROD_SERVER >> ~/.ssh/known_hosts
  script:
    - apk add --no-cache rsync
    - rsync -avz --delete $BUILD_DIR/html/ $USER@$PROD_SERVER:$TARGET_DIR
  only:
    - main

publish:
  stage: publish
  image: alpine:latest
  before_script:
    - apk add --no-cache git
  script:
    - echo "Publishing contents to GitHub"
    - git config --global user.email "github@rapporto.ru"
    - git config --global user.name "Rapporto AutoDeploy"
    - git clone --depth 1 https://$GITHUB_TOKEN@github.com/$GITHUB_REPO.git publish_directory
    - cp -r . publish_directory/
    - cd publish_directory
    - echo "generator/" >> .gitignore
    - echo "README.md" >> .gitignore
    - echo ".gitlab-ci.yml" >> .gitignore
    - git add .
    - git commit -m "Publish contents"
    - git push origin main
  only:
    - main
  dependencies:
    - deploy_prod