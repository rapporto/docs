stages:
  - build
  - deploy

variables:
  BUILD_DIR: "build"
  TARGET_DIR: "/docs/_build/"

build:
  stage: build
  image: python:3.9
  script:
    - pip install tomli pydata-sphinx-theme==0.16.0 sphinx==7.3.0 sphinx-rtd-theme==3.0.2 sphinx-tabs==3.4.7 sphinx-book-theme==1.1.3
    - rm -rf _build
    - sphinx-build -b html source $BUILD_DIR/html
  artifacts:
    paths:
      - $BUILD_DIR/html

deploy_test:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client
    - mkdir -p ~/.ssh
    - echo "$TEST_SSH_KEY" > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - ssh-keyscan -H $TEST_SERVER >> ~/.ssh/known_hosts
  script:
    - apk add --no-cache rsync
    - rsync -avz --delete $BUILD_DIR/html/ $USER@$TEST_SERVER:$TARGET_DIR
  only:
    - test

deploy_prod:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client
    - mkdir -p ~/.ssh
    - echo "$PROD_SSH_KEY" > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - ssh-keyscan -H $PROD_SERVER >> ~/.ssh/known_hosts
  script:
    - apk add --no-cache rsync
    - rsync -avz --delete $BUILD_DIR/html/ $USER@$PROD_SERVER:$TARGET_DIR
  only:
    - main